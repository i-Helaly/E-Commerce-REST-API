openapi: 3.0.0

info:
  title: "E-Commerce REST API"
  version: "1.0.0"
  description: "Documentation for E-Commerce REST API"

components:
  schemas:
    Categories:
      type: object
      properties:
        name:
          type: string
        description:
          type : string  


paths:
  /api/categories:
    get:
      summary: "Get all categories"
      responses:
        "200":
          description: "All categories retrieved successfully"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  data:
                    type: object
                    properties:
                      categories:
                        type: array
                        items:
                          $ref: "#/components/schemas/Categories"

              

